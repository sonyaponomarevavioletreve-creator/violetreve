  /* Концепт: рабочий стол Mac. Строка меню, иконка по центру, четыре папки, внизу баннер. Светлая тема одна на всех: картинки на белом. */
  :root {
    color-scheme: light;
    --desk: #ffffff;
    --ink: #111114;
    --mute: #707078;
    --line: #e3e3e6;
    --bar: #f6f6f7;
    --hover: #e9e9ec;
    --select: #0a64d8;
    --on-select: #ffffff;
    --mono: "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--desk);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }

  /* Только вертикальный экран: на компьютере тоже колонка шириной с телефон */
  .screen {
    max-width: 430px;
    min-height: 100%;
    margin-inline: auto;
  }

  .menubar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    min-height: 30px;
    padding-block: 5px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .menu {
    display: flex;
    gap: 18px;
    min-width: 0;
  }
  .menu b { font-weight: 700; }
  .clock {
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  .desktop {
    padding-block: 10px 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    justify-items: center;
    gap: 14px;
  }

  .icon {
    display: block;
    width: 232px;
    max-width: 100%;
    height: auto;
  }

  .hint {
    position: relative;
    width: 100%;
    padding-inline: 44px;
    text-align: center;
  }
  .hint-text {
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .hint p {
    margin: 0;
    text-wrap: balance;
  }
  .hint-main {
    font-size: 12.5px;
    font-weight: 700;
  }
  .hint-note {
    font-size: 11.5px;
    color: var(--mute);
  }
  .hint-arrow {
    position: absolute;
    top: 2px;
    right: -4px;
    display: block;
    width: 46px;
    height: 40px;
    fill: none;
    stroke: var(--ink);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .folders {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    align-items: start;
  }

  .folder {
    min-width: 0;
    display: grid;
    justify-items: center;
    gap: 6px;
    color: inherit;
    text-decoration: none;
    text-align: center;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .glyph {
    display: block;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .glyph svg {
    display: block;
    width: 92px;
    height: auto;
    filter: drop-shadow(0 2px 3px rgba(20, 60, 110, 0.22));
  }
  .name {
    padding: 2px 6px;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    border-radius: 5px;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }

  a.folder:hover .glyph,
  a.folder:active .glyph,
  a.folder:focus-visible .glyph { background: var(--hover); }
  a.folder:hover .name,
  a.folder:active .name,
  a.folder:focus-visible .name {
    background: var(--select);
    color: var(--on-select);
    text-decoration: none;
  }
  a.folder:focus-visible { outline: none; }

  .banner {
    margin: 0;
  }
  .banner img {
    display: block;
    width: 100%;
    height: auto;
  }


  .footer {
    display: grid;
    justify-items: center;
    gap: 6px;
    padding-block: 12px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  .footer p {
    margin: 0;
    text-wrap: balance;
  }
  .note {
    font-size: 11.5px;
    color: var(--mute);
  }
</style>
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>

<script>

    var el = document.getElementById("clock");

    var time = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit" });
